name: CD Auth Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487124860968/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deploy@devopslab-504414.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Test privilege boundary
        run: |
          gcloud compute ssh devops-recovery \
            --project=devopslab-504414 \
            --zone=asia-southeast1-c \
            --tunnel-through-iap \
            --quiet \
            --command='
              set -eu

              echo "===== IDENTITY ====="
              echo "SSH: PASS"
              echo "USER: $(whoami)"
              echo "HOST: $(hostname)"
              id

              echo
              echo "===== DIRECT DOCKER MUST BE DENIED ====="
              if docker info >/dev/null 2>&1; then
                echo "ERROR: direct Docker access is unexpectedly allowed"
                exit 1
              fi
              echo "direct Docker: DENIED (expected)"

              echo
              echo "===== SUDO DOCKER MUST BE DENIED ====="
              if sudo -n docker ps >/dev/null 2>&1; then
                echo "ERROR: sudo docker is unexpectedly allowed"
                exit 1
              fi
              echo "sudo docker: DENIED (expected)"

              echo
              echo "===== SUDO SHELL MUST BE DENIED ====="
              if sudo -n /bin/bash -c true >/dev/null 2>&1; then
                echo "ERROR: sudo shell is unexpectedly allowed"
                exit 1
              fi
              echo "sudo shell: DENIED (expected)"

              echo
              echo "===== DEPLOY SUDO POLICY ====="
              sudo -n -l /usr/local/sbin/fullstack-deploy-backend 2da4c796b661e85522b36b6a9de22c36bb62fdda

              echo
              echo "privilege boundary: PASS"
            '
