services:
  mysql:
    image: mysql:9.7.2
    container_name: fullstack-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - fullstack_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - fullstack-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    image: fullstack-backend:0.1
    container_name: fullstack-backend
    restart: unless-stopped

    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "127.0.0.1:3001:3001"

    networks:
      - fullstack-network

  frontend:
    build:
      context: ./frontend
    image: fullstack-frontend:0.1
    container_name: fullstack-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - fullstack-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fullstack-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:80"

    networks:
      - fullstack-network

volumes:
  fullstack_mysql_data:

networks:
  fullstack-network:
    driver: bridge
