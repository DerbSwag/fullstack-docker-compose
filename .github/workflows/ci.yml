name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend syntax
        run: node --check backend/index.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate frontend build output
        run: test -s frontend/dist/index.html

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  integration:
    needs: validate
    runs-on: ubuntu-latest

    env:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_DATABASE: fullstack
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MySQL and backend
        run: docker compose up -d mysql backend

      - name: Show container status
        run: docker compose ps

      - name: Wait for backend to become healthy
        shell: bash
        run: |
          for i in {1..30}; do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' fullstack-backend 2>/dev/null || true)"

            echo "Backend health status: ${STATUS:-unknown}"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker compose ps
              docker compose logs mysql backend
              exit 1
            fi

            sleep 5
          done

          echo "Backend did not become healthy in time."
          docker compose ps
          docker compose logs mysql backend
          exit 1

      - name: Check backend health endpoint
        run: |
          curl --fail --show-error --silent \
            http://127.0.0.1:3001/health

      - name: Check users API
        run: |
          curl --fail --show-error --silent \
            http://127.0.0.1:3001/users

      - name: Show logs on failure
        if: failure()
        run: docker compose logs mysql backend

      - name: Cleanup integration environment
        if: always()
        run: docker compose down -v
